definitions:
  handlers.CreateBookingReq:
    properties:
      booked_for_id:
        description: Optional
        type: integer
      external_event_id:
        type: string
      external_event_type:
        type: string
      quantity:
        type: integer
      total_price:
        type: number
      user_id:
        type: integer
    required:
    - external_event_id
    - external_event_type
    - quantity
    - user_id
    type: object
  handlers.CreateProfileRequest:
    properties:
      email:
        type: string
      mobile_number:
        type: string
      name:
        type: string
      username:
        description: Optional for profile creation
        type: string
    required:
    - email
    - mobile_number
    - name
    type: object
  handlers.CreateRoomReq:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handlers.CreateUserRequest:
    properties:
      email:
        type: string
      username:
        type: string
    required:
    - email
    - username
    type: object
  handlers.FriendRequestReq:
    properties:
      friend_phone:
        type: string
      user_phone:
        type: string
    required:
    - friend_phone
    - user_phone
    type: object
  handlers.FriendResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      mobile_number:
        type: string
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  handlers.JoinRoomReq:
    properties:
      user_id:
        type: integer
    required:
    - user_id
    type: object
  handlers.ShareEventReq:
    properties:
      external_event_id:
        type: string
      external_event_type:
        type: string
      user_id:
        type: integer
    required:
    - external_event_id
    - external_event_type
    - user_id
    type: object
  models.Booking:
    properties:
      booked_for_id:
        description: ID of the friend this ticket was bought for (optional)
        type: integer
      created_at:
        type: string
      external_event_id:
        type: string
      external_event_type:
        description: e.g., "movie" or "concert"
        type: string
      id:
        type: integer
      quantity:
        type: integer
      status:
        type: string
      total_price:
        type: number
      user_id:
        type: integer
    type: object
  models.ChatRoom:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.ChatRoomMember:
    properties:
      id:
        type: integer
      joined_at:
        type: string
      room_id:
        type: integer
      user_id:
        type: integer
    type: object
  models.ExternalEvent:
    properties:
      date:
        description: String format for simplicity
        type: string
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      location:
        type: string
      price_max:
        type: number
      price_min:
        type: number
      title:
        type: string
      type:
        description: '"movie" or "concert"'
        type: string
      url:
        type: string
    type: object
  models.Friendship:
    properties:
      created_at:
        type: string
      friend_id:
        type: integer
      id:
        type: integer
      status:
        $ref: '#/definitions/models.FriendshipStatus'
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  models.FriendshipStatus:
    enum:
    - pending
    - accepted
    - declined
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusAccepted
    - StatusDeclined
  models.Message:
    properties:
      content:
        type: string
      created_at:
        type: string
      external_event_id:
        description: String ID from external API (TMDB/Ticketmaster)
        type: string
      external_event_type:
        description: '"movie" or "concert"'
        type: string
      id:
        type: integer
      room_id:
        type: integer
      sender_id:
        type: integer
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      mobile_number:
        type: string
      name:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/bookings:
    get:
      description: Get a list of bookings for a specific user (either bought by them,
        or bought for them)
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Booking'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List Bookings
      tags:
      - bookings
    post:
      consumes:
      - application/json
      description: Book a ticket for yourself or a friend
      parameters:
      - description: Booking Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateBookingReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Booking'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a Booking
      tags:
      - bookings
  /api/v1/events:
    get:
      description: Get a list of mock events (movies, concerts, dining)
      parameters:
      - description: Filter by event type (e.g. Movie, Concert)
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ExternalEvent'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List Events
      tags:
      - events
  /api/v1/events/{id}:
    get:
      description: Get details for a specific event
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ExternalEvent'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get Event Details
      tags:
      - events
  /api/v1/friends:
    get:
      description: Retrieve a list of accepted friends for a user by mobile number
      parameters:
      - description: User Mobile Number
        in: query
        name: user_phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.FriendResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List friends
      tags:
      - friends
  /api/v1/friends/accept:
    post:
      consumes:
      - application/json
      description: Accept a pending friend request using mobile numbers
      parameters:
      - description: Friend Request Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.FriendRequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Friendship'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Accept a friend request
      tags:
      - friends
  /api/v1/friends/request:
    post:
      consumes:
      - application/json
      description: Send a friend request to another user using mobile numbers
      parameters:
      - description: Friend Request Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.FriendRequestReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Friendship'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Send a friend request
      tags:
      - friends
  /api/v1/friends/status:
    get:
      description: Get the current friendship status between two users via mobile
        numbers
      parameters:
      - description: User Mobile Number
        in: query
        name: user_phone
        required: true
        type: string
      - description: Friend Mobile Number
        in: query
        name: friend_phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get friend status
      tags:
      - friends
  /api/v1/profile:
    post:
      consumes:
      - application/json
      description: Register a new profile with name, email, and mobile number
      parameters:
      - description: Profile Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a user profile
      tags:
      - users
  /api/v1/rooms:
    post:
      consumes:
      - application/json
      description: Create a new chat room
      parameters:
      - description: Room Name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateRoomReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ChatRoom'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a chat room
      tags:
      - chat
  /api/v1/rooms/{id}/join:
    post:
      consumes:
      - application/json
      description: Add a user to a chat room
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.JoinRoomReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ChatRoomMember'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Join a chat room
      tags:
      - chat
  /api/v1/rooms/{id}/messages:
    get:
      description: Retrieve message history for a chat room
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Message'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get room messages
      tags:
      - chat
  /api/v1/rooms/{id}/share:
    post:
      consumes:
      - application/json
      description: Share a specific TMDB or Ticketmaster event to a chat room
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID and External Event Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ShareEventReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Message'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Share an external event in a chat room
      tags:
      - chat
  /api/v1/rooms/{id}/ws:
    get:
      description: Connect to real-time chat via WebSocket
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      responses: {}
      summary: WebSocket for Chat Room
      tags:
      - chat
  /api/v1/users:
    post:
      consumes:
      - application/json
      description: Register a new user in the system
      parameters:
      - description: User Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a user
      tags:
      - users
swagger: "2.0"
