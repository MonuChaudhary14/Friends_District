basePath: /
definitions:
  district-friends_internal_models.Booking:
    properties:
      booked_for_id:
        description: ID of the friend this ticket was bought for (optional)
        type: integer
      created_at:
        type: string
      external_event_id:
        type: string
      external_event_type:
        description: e.g., "movie" or "concert"
        type: string
      id:
        type: integer
      quantity:
        type: integer
      status:
        type: string
      total_price:
        type: number
      user_id:
        type: integer
    type: object
  district-friends_internal_models.ChatRoom:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  district-friends_internal_models.ChatRoomMember:
    properties:
      id:
        type: integer
      joined_at:
        type: string
      room_id:
        type: integer
      status:
        description: '"pending" or "joined"'
        type: string
      user_id:
        type: integer
    type: object
  district-friends_internal_models.ExternalEvent:
    properties:
      date:
        description: String format for simplicity
        type: string
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      location:
        type: string
      price_max:
        type: number
      price_min:
        type: number
      title:
        type: string
      type:
        description: '"movie" or "concert"'
        type: string
      url:
        type: string
    type: object
  district-friends_internal_models.Friendship:
    properties:
      created_at:
        type: string
      friend_id:
        type: integer
      id:
        type: integer
      status:
        $ref: '#/definitions/district-friends_internal_models.FriendshipStatus'
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  district-friends_internal_models.FriendshipStatus:
    enum:
    - pending
    - accepted
    - declined
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusAccepted
    - StatusDeclined
  district-friends_internal_models.Message:
    properties:
      content:
        type: string
      created_at:
        type: string
      external_event_id:
        description: String ID from external API (TMDB/Ticketmaster)
        type: string
      external_event_type:
        description: '"movie" or "concert"'
        type: string
      id:
        type: integer
      room_id:
        type: integer
      sender_id:
        type: integer
    type: object
  district-friends_internal_models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      mobile_number:
        type: string
      name:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  internal_api_handlers.CreateBookingReq:
    properties:
      booked_for_phone:
        description: Optional
        type: string
      external_event_id:
        type: string
      external_event_type:
        type: string
      quantity:
        type: integer
      total_price:
        type: number
      user_phone:
        type: string
    required:
    - external_event_id
    - external_event_type
    - quantity
    - user_phone
    type: object
  internal_api_handlers.CreateProfileRequest:
    properties:
      email:
        type: string
      mobile_number:
        type: string
      name:
        type: string
      username:
        description: Optional for profile creation
        type: string
    required:
    - email
    - mobile_number
    - name
    type: object
  internal_api_handlers.CreateRoomReq:
    properties:
      name:
        type: string
      user_phone:
        type: string
    required:
    - name
    - user_phone
    type: object
  internal_api_handlers.FriendRequestReq:
    properties:
      friend_phone:
        type: string
      user_phone:
        type: string
    required:
    - friend_phone
    - user_phone
    type: object
  internal_api_handlers.FriendResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      mobile_number:
        type: string
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  internal_api_handlers.HandleRoomInviteReq:
    properties:
      user_phone:
        type: string
    required:
    - user_phone
    type: object
  internal_api_handlers.InviteRoomReq:
    properties:
      invitee_phone:
        type: string
      inviter_phone:
        type: string
    required:
    - invitee_phone
    - inviter_phone
    type: object
  internal_api_handlers.JoinRoomReq:
    properties:
      user_phone:
        type: string
    required:
    - user_phone
    type: object
  internal_api_handlers.ShareEventReq:
    properties:
      external_event_id:
        type: string
      external_event_type:
        type: string
      user_phone:
        type: string
    required:
    - external_event_id
    - external_event_type
    - user_phone
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a friends feature extension backend.
  title: Friends District API
  version: "1.0"
paths:
  /api/v1/bookings:
    get:
      description: Get a list of bookings for a specific user (either bought by them,
        or bought for them)
      parameters:
      - description: User Phone
        in: query
        name: user_phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/district-friends_internal_models.Booking'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List Bookings
      tags:
      - bookings
    post:
      consumes:
      - application/json
      description: Book a ticket for yourself or a friend
      parameters:
      - description: Booking Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.CreateBookingReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/district-friends_internal_models.Booking'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a Booking
      tags:
      - bookings
  /api/v1/events:
    get:
      description: Get a list of mock events (movies, concerts, dining)
      parameters:
      - description: Filter by event type (e.g. Movie, Concert)
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/district-friends_internal_models.ExternalEvent'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List Events
      tags:
      - events
  /api/v1/events/{id}:
    get:
      description: Get details for a specific event
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/district-friends_internal_models.ExternalEvent'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get Event Details
      tags:
      - events
  /api/v1/events/spotlight:
    get:
      description: Get a curated list of top trending events (one movie, one concert,
        one dining)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/district-friends_internal_models.ExternalEvent'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get Spotlight Events
      tags:
      - events
  /api/v1/friends:
    get:
      description: Retrieve a list of accepted friends for a user by mobile number
      parameters:
      - description: User Mobile Number
        in: query
        name: user_phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api_handlers.FriendResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List friends
      tags:
      - friends
  /api/v1/friends/accept:
    post:
      consumes:
      - application/json
      description: Accept a pending friend request using mobile numbers
      parameters:
      - description: Friend Request Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.FriendRequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/district-friends_internal_models.Friendship'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Accept a friend request
      tags:
      - friends
  /api/v1/friends/reject:
    post:
      consumes:
      - application/json
      description: Reject a pending friend request using mobile numbers
      parameters:
      - description: Friend Request Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.FriendRequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/district-friends_internal_models.Friendship'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Reject a friend request
      tags:
      - friends
  /api/v1/friends/request:
    post:
      consumes:
      - application/json
      description: Send a friend request to another user using mobile numbers
      parameters:
      - description: Friend Request Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.FriendRequestReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/district-friends_internal_models.Friendship'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Send a friend request
      tags:
      - friends
  /api/v1/friends/requests/received:
    get:
      description: Retrieve a list of pending friend requests received by the user
      parameters:
      - description: User Mobile Number
        in: query
        name: user_phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api_handlers.FriendResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List received friend requests
      tags:
      - friends
  /api/v1/friends/requests/sent:
    get:
      description: Retrieve a list of pending friend requests sent by the user
      parameters:
      - description: User Mobile Number
        in: query
        name: user_phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api_handlers.FriendResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List sent friend requests
      tags:
      - friends
  /api/v1/friends/status:
    get:
      description: Get the current friendship status between two users via mobile
        numbers
      parameters:
      - description: User Mobile Number
        in: query
        name: user_phone
        required: true
        type: string
      - description: Friend Mobile Number
        in: query
        name: friend_phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get friend status
      tags:
      - friends
  /api/v1/profile:
    get:
      description: Retrieve a user's profile using their mobile number
      parameters:
      - description: Mobile Number
        in: query
        name: mobile_number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/district-friends_internal_models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get a user profile
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Register a new profile with name, email, and mobile number
      parameters:
      - description: Profile Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.CreateProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/district-friends_internal_models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a user profile
      tags:
      - users
  /api/v1/rooms:
    get:
      description: Get a list of chat rooms that the user is a member of
      parameters:
      - description: User Phone
        in: query
        name: user_phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/district-friends_internal_models.ChatRoom'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List Joined Rooms
      tags:
      - chat
    post:
      consumes:
      - application/json
      description: Create a new chat room and automatically join as a member
      parameters:
      - description: Room Name and User Phone
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.CreateRoomReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/district-friends_internal_models.ChatRoom'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a chat room
      tags:
      - chat
  /api/v1/rooms/{id}/accept:
    post:
      consumes:
      - application/json
      description: Accept a pending invitation to join a chat room
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: User Phone
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.HandleRoomInviteReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/district-friends_internal_models.ChatRoomMember'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Accept a room invite
      tags:
      - chat
  /api/v1/rooms/{id}/invite:
    post:
      consumes:
      - application/json
      description: Invite a user to join an existing chat room. The inviter must already
        be a member.
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: Inviter and Invitee Phones
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.InviteRoomReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/district-friends_internal_models.ChatRoomMember'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Invite a user to a chat room
      tags:
      - chat
  /api/v1/rooms/{id}/join:
    post:
      consumes:
      - application/json
      description: Add a user to a chat room
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: User Phone
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.JoinRoomReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/district-friends_internal_models.ChatRoomMember'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Join a chat room
      tags:
      - chat
  /api/v1/rooms/{id}/members:
    get:
      description: Get all members in a specific chat room
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/district-friends_internal_models.User'
            type: array
      summary: List Room Members
      tags:
      - chat
  /api/v1/rooms/{id}/messages:
    get:
      description: Retrieve message history for a chat room
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/district-friends_internal_models.Message'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get room messages
      tags:
      - chat
  /api/v1/rooms/{id}/reject:
    post:
      consumes:
      - application/json
      description: Reject a pending invitation to join a chat room
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: User Phone
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.HandleRoomInviteReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Reject a room invite
      tags:
      - chat
  /api/v1/rooms/{id}/share:
    post:
      consumes:
      - application/json
      description: Share a specific TMDB or Ticketmaster event to a chat room
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: User Phone and External Event Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.ShareEventReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/district-friends_internal_models.Message'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Share an external event in a chat room
      tags:
      - chat
  /api/v1/rooms/{id}/ws:
    get:
      description: Connect to real-time chat via WebSocket
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: User Phone
        in: query
        name: user_phone
        required: true
        type: string
      responses: {}
      summary: WebSocket for Chat Room
      tags:
      - chat
  /api/v1/rooms/invites:
    get:
      description: Get a list of chat rooms that the user has been invited to but
        hasn't joined
      parameters:
      - description: User Phone
        in: query
        name: user_phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/district-friends_internal_models.ChatRoom'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List Pending Room Invites
      tags:
      - chat
swagger: "2.0"
